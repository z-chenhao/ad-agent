name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm exec prettier -- --check . --ignore-path .gitignore

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: make build
      - run: npm exec --workspace=@ad-agent/web -- playwright install --with-deps chromium
      - run: npm run test:e2e --workspace=@ad-agent/web
