name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: ./scripts/check-english.sh
      - run: npm exec prettier -- --check . --ignore-path .gitignore

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: make build
      - name: Credential-free source-install smoke test
        run: node scripts/smoke.mjs
      - run: npm exec --workspace=@ad-agent/web -- playwright install --with-deps chromium
      - run: npm run test:e2e --workspace=@ad-agent/web
      - run: npm run test:e2e:manager --workspace=@ad-agent/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
